<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday Sermon Repurposed</title>
    <style>
        :root {
            --navy: #1E293B;
            --dark-slate: #151E2E;
            --gold: #B4833E;
            --cream: #F8F6F0;
            --white: #FFFFFF;
            --sans-font: 'Plus Jakarta Sans', sans-serif;
            --font-family: 'Playfair Display', serif;
        }

        body {
            font-family: var(--sans-font);
            background-color: var(--cream);
            color: var(--navy);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            background-color: var(--navy);
            color: var(--white);
            padding: 20px 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-family);
            font-size: 24px;
            font-weight: bold;
            color: var(--white);
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }

        .btn-gold {
            background-color: var(--gold);
            color: var(--white);
        }

        .hero {
            padding: 100px 0;
            text-align: center;
            background-color: var(--white);
        }

        h1 {
            font-family: var(--font-family);
            size: 48px;
            color: var(--navy);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="#" class="logo">Sermon Repurposed</a>
            <ul class="nav-links">
                <li><a href="#services">Services</a></li>
                <li><a href="#pricing">Pricing</a></li>
                <li><a href="https://docs.google.com/forms/d/e/1FAIpQLSfTgFP3VF44NzrEPQnu3I1CAdUq1BdYJeHyQHriyosO_C8LFQ/viewform" class="btn btn-gold">Request Your Content</a></li>
            </ul>
        </div>
    </header>
    <section class="hero">
        <div class="container">
            <h1>One Sermon. A Whole Week of Content.</h1>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfTgFP3VF44NzrEPQnu3I1CAdUq1BdYJeHyQHriyosO_C8LFQ/viewform" class="btn btn-gold">Request Your Content</a>
        </div>
    </section>
</body>
</html>
